[project]
name = "paraserv"
version = "0.1.0"
description = "Talk to Claude Code or OpenCode: a background Parakeet speech-to-text server, a microphone listener, and the pclaude and popencode wrappers that type transcripts into the active CLI."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "huggingface-hub>=2.4,<3",
    "mlx-audio>=0.6.5,<0.7",
    "numpy>=2.5,<3",
    "onnx-asr[cpu,hub]>=0.12,<0.13",
    "onnxruntime>=1.31,<2",
    "sounddevice>=0.5.6,<0.6",
]
